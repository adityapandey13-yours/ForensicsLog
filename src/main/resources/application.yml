spring:
  application:
    name: forensic-log-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/forensicdb
    username: forensic
    password: forensic123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 3GB
      max-request-size: 3GB

server:
  port: 8080

async:
  core-pool-size: 8
  max-pool-size: 16
  queue-capacity: 1000
